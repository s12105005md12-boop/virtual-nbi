[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-nbi"
version = "0.1.0"
description = "Virtual narrow-band imaging (vNBI) from white-light endoscopy: open-source, real-time, hardware-free"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Jia-Hau Lin", email = "s12105005.md12@nycu.edu.tw" },
    { name = "Li-Fen Chen" },
    { name = "Muh-Hwa Yang" },
]
dependencies = [
    "numpy>=1.21",
    "Pillow>=9.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
vesselness = ["scikit-image>=0.19"]
ica = ["scikit-learn>=1.0"]
torch = ["torch>=1.10"]

[project.urls]
Homepage = "https://github.com/s12105005md12-boop/virtual-nbi"

[tool.setuptools]
packages = ["virtualnbi"]
